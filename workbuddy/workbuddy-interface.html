<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WorkBuddy · 你的职场超能力</title>
  <link rel="icon" href="assets/images/workbuddy-logo.svg" type="image/svg+xml">
  <style>
    @font-face{font-family:Assistant;src:url("assets/fonts/assistant-regular.woff2") format("woff2");font-weight:400;font-display:swap}
    @font-face{font-family:Assistant;src:url("assets/fonts/assistant-medium.woff2") format("woff2");font-weight:500;font-display:swap}
    @font-face{font-family:Assistant;src:url("assets/fonts/assistant-semibold.woff2") format("woff2");font-weight:600 800;font-display:swap}
    :root{
      --bg:oklch(.9612 0 89.88);--surface:oklch(1 0 89.88);--fg:oklch(.2393 0 89.88);
      --muted:oklch(.5999 0 89.88);--border:oklch(.9249 0 89.88);--accent:oklch(.7246 .142 170.99);
      --ink-70:rgba(0,0,0,.7);--ink-50:rgba(0,0,0,.5);--ink-30:rgba(0,0,0,.3);
      --hover:rgba(0,0,0,.05);--active:rgba(0,0,0,.08);--danger:#e5484d;
      --sidebar:240px;--menu-h:30px;--ease:cubic-bezier(.2,.75,.25,1);
      font-family:Assistant,"Microsoft YaHei UI","PingFang SC",sans-serif;color-scheme:light;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;overflow:hidden;background:var(--surface);color:var(--fg)}
    body{font-size:14px;letter-spacing:0}
    button,input,textarea{font:inherit;letter-spacing:0}
    button{color:inherit}
    [hidden]{display:none!important}
    .icon{width:18px;height:18px;stroke-width:1.75;flex:0 0 auto}
    .app-menu{height:var(--menu-h);display:flex;align-items:center;justify-content:space-between;padding:0 8px;background:var(--surface);border-bottom:1px solid rgba(0,0,0,.03);user-select:none;position:relative;z-index:30}
    .menu-left,.menu-right{display:flex;align-items:center;height:100%}
    .menu-brand{display:flex;align-items:center;gap:6px;font-weight:500;padding:0 6px}
    .menu-brand img{width:16px;height:16px;border-radius:4px}
    .menu-link{border:0;background:transparent;height:100%;padding:0 10px;cursor:pointer;font-size:13px}
    .menu-link:hover{background:var(--hover)}
    .window-control{width:42px;height:100%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer}
    .window-control:hover{background:var(--hover)}
    .window-control.close:hover{background:#c42b1c;color:white}
    .window-control .icon{width:14px;height:14px}
    .shell{height:calc(100% - var(--menu-h));display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);transition:grid-template-columns .24s var(--ease)}
    .shell.sidebar-collapsed{grid-template-columns:58px minmax(0,1fr)}
    .sidebar{background:var(--bg);min-width:0;height:100%;display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:20}
    .sidebar-header{padding:0 12px 14px}
    .brand-row{height:56px;display:flex;align-items:center;gap:8px;position:relative}
    .brand-copy{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.1}
    .brand-name{font-size:13px;font-weight:600;color:var(--ink-50);white-space:nowrap}
    .brand-version{font-size:10px;color:var(--ink-30);margin-top:4px;white-space:nowrap}
    .sidebar-actions{display:flex;gap:2px}
    .icon-button{width:32px;height:32px;border:0;border-radius:8px;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink-70);position:relative}
    .icon-button:hover{background:var(--hover);color:var(--fg)}
    .icon-button.active{background:var(--active);color:var(--fg)}
    .icon-button .icon{width:17px;height:17px}
    .nav-list{display:flex;flex-direction:column;gap:2px}
    .nav-button{height:32px;width:100%;padding:0 12px;border:0;border-radius:8px;background:transparent;display:flex;align-items:center;gap:9px;font-size:14px;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden}
    .nav-button:hover{background:var(--hover)}
    .nav-button.active{background:var(--active);font-weight:600}
    .nav-button .icon{width:17px;height:17px}
    .nav-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
    .nav-meta{font-size:11px;color:var(--ink-30);font-weight:400}
    .sidebar-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:8px 12px 20px;scrollbar-width:none}
    .sidebar-scroll::-webkit-scrollbar{display:none}
    .section-head{height:34px;display:flex;align-items:center;gap:4px;color:var(--ink-30);font-size:12px;font-weight:500;padding:0 2px;margin-top:4px;white-space:nowrap}
    .section-head .icon{width:13px;height:13px}
    .task-row{height:34px;display:flex;align-items:center;gap:8px;padding:0 2px;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden}
    .task-row:hover{background:var(--hover);padding:0 8px;margin:0 -6px}
    .task-title{font-size:13px;overflow:hidden;text-overflow:ellipsis;flex:1}
    .task-time{font-size:11px;color:var(--ink-30);flex:0 0 auto}
    .status-error{color:var(--danger);width:15px;height:15px}
    .view-more{border:0;background:transparent;padding:8px 2px;color:var(--ink-30);font-size:12px;cursor:pointer;font-weight:500}
    .space-row{height:32px;display:flex;align-items:center;gap:8px;white-space:nowrap;padding:0 2px;color:var(--ink-70)}
    .space-row .icon{width:16px;height:16px}
    .search-box{height:34px;margin:2px 0 8px;background:var(--border);border-radius:999px;display:flex;align-items:center;padding:0 8px;gap:6px;animation:reveal .18s var(--ease)}
    .search-box input{min-width:0;flex:1;border:0;outline:0;background:transparent;font-size:12px;color:var(--fg)}
    .search-box input::placeholder{color:var(--ink-30)}
    .search-box .icon{width:15px;height:15px;color:var(--ink-50)}
    .shell.sidebar-collapsed .brand-copy,.shell.sidebar-collapsed .sidebar-actions .search-trigger,.shell.sidebar-collapsed .sidebar-actions .filter-trigger,.shell.sidebar-collapsed .nav-label,.shell.sidebar-collapsed .nav-meta,.shell.sidebar-collapsed .sidebar-scroll,.shell.sidebar-collapsed .search-box{display:none}
    .shell.sidebar-collapsed .sidebar-header{padding:0 9px}
    .shell.sidebar-collapsed .brand-row{justify-content:center}
    .shell.sidebar-collapsed .sidebar-actions{display:block}
    .shell.sidebar-collapsed .collapse-trigger{transform:rotate(180deg)}
    .shell.sidebar-collapsed .nav-button{width:40px;height:40px;padding:0;justify-content:center;margin:3px 0}
    .shell.sidebar-collapsed .nav-button .icon{width:19px;height:19px}
    .main{position:relative;min-width:0;height:100%;background:var(--surface);overflow:hidden}
    .mobile-topbar{display:none}
    .home-view{height:100%;overflow:auto;scrollbar-width:none;padding:0 24px}
    .home-view::-webkit-scrollbar{display:none}
    .home-page{width:100%;max-width:800px;margin:0 auto;padding:clamp(135px,28vh,300px) 0 48px;min-height:100%;animation:fade-up .35s var(--ease)}
    .home-header{min-height:96px;display:flex;flex-direction:column;gap:0;text-align:left}
    .home-title,.home-subtitle{margin:0;font-family:"Microsoft YaHei UI","PingFang SC",Assistant,sans-serif;font-size:36px;font-weight:600;line-height:48px;letter-spacing:0;color:var(--fg)}
    .scene-tabs{display:inline-flex;align-items:center;gap:2px;padding:2px;height:36px;width:max-content;margin:16px 0 48px;background:var(--border);border-radius:10px}
    .scene-tab{height:32px;padding:0 12px;border:0;border-radius:8px;background:transparent;display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink-70);transition:background .18s,color .18s}
    .scene-tab:hover{background:rgba(255,255,255,.55)}
    .scene-tab.active{background:rgba(0,0,0,.75);color:#fff;font-weight:600;box-shadow:0 1px 1px rgba(0,0,0,.12)}
    .scene-tab .icon{width:16px;height:16px}
    .composer{display:flex;flex-direction:column;gap:12px;position:relative}
    .chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:32px}
    .chip{height:32px;padding:0 12px;border-radius:8px;border:1px solid rgba(0,0,0,.08);background:#fff;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.02);transition:background .15s,transform .15s}
    .chip:hover{background:var(--bg);transform:translateY(-1px)}
    .chip.selected{background:var(--active);border-color:rgba(0,0,0,.12)}
    .chip .icon{width:16px;height:16px;color:var(--ink-70)}
    .input-shell{background:linear-gradient(180deg,#f0f0f0 0%,#f5f5f5 100%);padding:2px 2px 4px;border-radius:18px;box-shadow:0 12px 24px -8px rgba(0,0,0,.08),0 2px 4px -3px rgba(0,0,0,.06);position:relative;z-index:2}
    .input-card{min-height:154px;border-radius:16px;background:#fff;display:flex;flex-direction:column;padding:18px 18px 12px;position:relative;overflow:hidden}
    .prompt{width:100%;min-height:74px;max-height:170px;resize:none;border:0;outline:0;color:var(--fg);font-size:14px;line-height:25px;background:transparent;padding:0 58px 0 0}
    .prompt::placeholder{color:var(--ink-30)}
    .input-tools{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .tools-left,.tools-right{display:flex;align-items:center;gap:5px}
    .round-tool{width:32px;height:32px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;color:var(--ink-70);cursor:pointer}
    .round-tool:hover{background:var(--bg)}
    .text-tool{height:32px;padding:0 8px;border:0;border-radius:8px;background:transparent;display:flex;align-items:center;gap:5px;color:var(--ink-70);font-size:13px;cursor:pointer}
    .text-tool:hover{background:var(--bg)}
    .text-tool .icon{width:16px;height:16px}
    .send-button{width:32px;height:32px;border:0;border-radius:50%;background:var(--accent);color:white;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 10px color-mix(in srgb,var(--accent) 36%,transparent);transform:scale(1);transition:transform .15s,opacity .15s}
    .send-button:disabled{opacity:0;transform:scale(.75);pointer-events:none}
    .send-button .icon{width:17px;height:17px;stroke-width:2.2}
    .input-cat{position:absolute;right:-5px;top:-2px;width:72px;height:auto;opacity:.85;pointer-events:none;transform:translateY(-58px);transition:transform .28s var(--ease)}
    .input-shell:hover .input-cat{transform:translateY(-48px)}
    .composer-footer{display:flex;align-items:center;gap:12px;padding:0 14px;color:var(--ink-50);font-size:12px}
    .footer-option{display:flex;align-items:center;gap:5px;cursor:pointer}
    .footer-option .icon{width:15px;height:15px}
    .activity-card{position:absolute;right:0;top:54%;transform:translateY(-50%);width:214px;min-height:128px;background:color-mix(in srgb,var(--accent) 7%,white);border-radius:16px 0 0 16px;padding:14px 16px;box-shadow:0 2px 10px rgba(0,0,0,.03);z-index:4;transition:transform .25s var(--ease),opacity .25s}
    .activity-card.closed{transform:translate(100%,-50%);opacity:0;pointer-events:none}
    .activity-title{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink-70)}
    .activity-title .icon{width:17px;height:17px;color:var(--accent);fill:var(--accent)}
    .activity-copy{font-size:12px;line-height:20px;color:var(--ink-70);margin:10px 0 12px}
    .activity-actions{display:flex;justify-content:flex-end;gap:8px}
    .link-button{height:28px;padding:0 10px;border:0;border-radius:7px;background:#fff;font-size:12px;font-weight:600;cursor:pointer}
    .close-activity{width:28px;height:28px;border:0;border-radius:7px;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink-50)}
    .close-activity:hover{background:rgba(255,255,255,.7)}
    .chat-view{height:100%;display:flex;flex-direction:column;background:var(--surface);animation:fade-up .25s var(--ease)}
    .chat-header{height:54px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 18px;flex:0 0 auto}
    .chat-header-title{font-weight:600;flex:1;text-align:center;margin-right:42px}
    .messages{width:100%;max-width:832px;flex:1;min-height:0;margin:0 auto;overflow:auto;padding:40px 24px 28px}
    .message{display:flex;gap:12px;margin-bottom:28px;animation:fade-up .25s var(--ease)}
    .message.user{justify-content:flex-end}
    .avatar{width:30px;height:30px;border-radius:9px;flex:0 0 auto}
    .message-bubble{max-width:72%;padding:11px 14px;border-radius:12px;background:var(--bg);line-height:1.6}
    .message.user .message-bubble{background:rgba(0,0,0,.82);color:#fff;border-bottom-right-radius:4px}
    .message.assistant .message-bubble{background:transparent;padding:4px 0;max-width:80%}
    .chat-composer{width:calc(100% - 48px);max-width:800px;margin:0 auto 24px}
    .module-view{height:100%;overflow:auto;padding:34px 42px 56px;animation:fade-up .3s var(--ease)}
    .module-inner{max-width:980px;margin:0 auto}
    .module-toolbar{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:30px}
    .module-heading{margin:0;font-size:28px;line-height:38px;font-weight:600}
    .module-subtitle{margin:6px 0 0;color:var(--ink-50);line-height:22px}
    .primary-button{height:38px;padding:0 16px;border:0;border-radius:8px;background:rgba(0,0,0,.82);color:#fff;display:flex;align-items:center;gap:7px;font-weight:600;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.14)}
    .primary-button:hover{background:#000}
    .primary-button .icon{width:17px;height:17px}
    .module-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    .module-card{border:1px solid var(--border);border-radius:8px;background:#fff;padding:18px;min-height:148px;display:flex;flex-direction:column;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}
    .module-card:hover{border-color:rgba(0,0,0,.2);box-shadow:0 8px 20px rgba(0,0,0,.06);transform:translateY(-2px)}
    .module-card-head{display:flex;align-items:center;gap:10px;font-weight:600}
    .module-card-icon{width:34px;height:34px;border-radius:8px;background:var(--bg);display:grid;place-items:center}
    .module-card-icon .icon{width:18px;height:18px}
    .module-card p{font-size:13px;color:var(--ink-50);line-height:21px;margin:14px 0 0}
    .module-card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:14px;font-size:12px;color:var(--ink-30)}
    .status-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:5px}
    .switch{width:38px;height:22px;padding:2px;border:0;border-radius:999px;background:#d7d7d7;cursor:pointer;transition:background .18s}
    .switch::after{content:"";display:block;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .18s}
    .switch.on{background:var(--accent)}
    .switch.on::after{transform:translateX(16px)}
    .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);background:rgba(0,0,0,.84);color:#fff;border-radius:8px;padding:10px 14px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    @keyframes fade-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes reveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
    @media (max-width:1100px){
      .activity-card{display:none}.home-page{padding-top:18vh}.module-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media (max-width:760px){
      :root{--menu-h:0px}.app-menu{display:none}.shell,.shell.sidebar-collapsed{display:block;height:100%}.sidebar{position:fixed;left:0;top:0;bottom:0;width:min(82vw,292px);transform:translateX(-100%);box-shadow:16px 0 40px rgba(0,0,0,.12);transition:transform .24s var(--ease)}
      .shell.mobile-sidebar-open .sidebar{transform:translateX(0)}.shell.sidebar-collapsed .brand-copy,.shell.sidebar-collapsed .sidebar-actions .search-trigger,.shell.sidebar-collapsed .sidebar-actions .filter-trigger,.shell.sidebar-collapsed .nav-label,.shell.sidebar-collapsed .nav-meta,.shell.sidebar-collapsed .sidebar-scroll{display:initial}
      .shell.sidebar-collapsed .sidebar-header{padding:0 12px}.shell.sidebar-collapsed .brand-row{justify-content:flex-start}.shell.sidebar-collapsed .sidebar-actions{display:flex}.shell.sidebar-collapsed .nav-button{width:100%;height:32px;padding:0 12px;justify-content:flex-start;margin:0}.shell.sidebar-collapsed .collapse-trigger{transform:none}
      .mobile-topbar{height:48px;display:flex;align-items:center;padding:0 10px;position:absolute;left:0;right:0;top:0;z-index:10;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,0,0,.05)}
      .mobile-title{flex:1;text-align:center;font-weight:600;margin-right:32px}.home-view{padding:0 18px}.home-page{padding-top:112px}.home-title,.home-subtitle{font-size:27px;line-height:38px}.home-header{min-height:76px}.scene-tabs{width:100%;margin:14px 0 34px}.scene-tab{flex:1;padding:0 8px}.input-card{min-height:168px}.prompt{padding-right:0}.input-cat{display:none}.chips{flex-wrap:wrap;overflow:visible;padding-bottom:2px}.chip{flex:0 0 auto}.module-view{padding:78px 18px 38px}.module-toolbar{align-items:stretch;flex-direction:column}.module-grid{grid-template-columns:1fr}.messages{padding-top:72px}.chat-header{padding-left:52px}.message-bubble{max-width:86%}
    }
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <header class="app-menu" data-od-id="desktop-menu">
    <div class="menu-left">
      <div class="menu-brand"><img src="assets/images/workbuddy-logo.svg" alt="WorkBuddy 标志"><span>WorkBuddy</span></div>
      <button class="menu-link">编辑(E)</button><button class="menu-link">窗口(W)</button><button class="menu-link">帮助(H)</button>
    </div>
    <div class="menu-right" aria-label="窗口控制">
      <button class="window-control" title="最小化"><i data-lucide="minus" class="icon"></i></button>
      <button class="window-control" title="最大化"><i data-lucide="square" class="icon"></i></button>
      <button class="window-control close" title="关闭"><i data-lucide="x" class="icon"></i></button>
    </div>
  </header>
  <div class="shell" id="shell" data-od-id="workbuddy-shell">
    <aside class="sidebar" data-od-id="primary-sidebar">
      <div class="sidebar-header">
        <div class="brand-row" data-od-id="sidebar-brand">
          <div class="brand-copy"><span class="brand-name">WorkBuddy</span><span class="brand-version">v5.2.5</span></div>
          <div class="sidebar-actions">
            <button class="icon-button collapse-trigger" id="collapseBtn" title="收起侧边栏" aria-label="收起侧边栏"><i data-lucide="panel-left-close" class="icon"></i></button>
            <button class="icon-button search-trigger" id="searchBtn" title="搜索任务" aria-label="搜索任务"><i data-lucide="search" class="icon"></i></button>
            <button class="icon-button filter-trigger" id="filterBtn" title="筛选任务" aria-label="筛选任务"><i data-lucide="list-filter" class="icon"></i></button>
          </div>
        </div>
        <div class="search-box" id="searchBox" hidden><i data-lucide="search" class="icon"></i><input id="taskSearch" type="search" placeholder="搜索任务"><button class="icon-button" id="clearSearch" title="关闭搜索"><i data-lucide="x" class="icon"></i></button></div>
        <nav class="nav-list" aria-label="主导航">
          <button class="nav-button active" data-view="home" data-od-id="nav-new-task"><i data-lucide="message-circle-plus" class="icon"></i><span class="nav-label">新建任务</span></button>
          <button class="nav-button" data-view="assistant" data-od-id="nav-assistant"><i data-lucide="bot" class="icon"></i><span class="nav-label">助理</span></button>
          <button class="nav-button" data-view="projects" data-od-id="nav-projects"><i data-lucide="git-branch" class="icon"></i><span class="nav-label">项目</span></button>
          <button class="nav-button" data-view="capabilities" data-od-id="nav-capabilities"><i data-lucide="blocks" class="icon"></i><span class="nav-label">专家·技能·连接器</span></button>
          <button class="nav-button" data-view="automation" data-od-id="nav-automation"><i data-lucide="alarm-clock-check" class="icon"></i><span class="nav-label">自动化</span></button>
          <button class="nav-button" data-view="more" data-od-id="nav-more"><i data-lucide="layout-grid" class="icon"></i><span class="nav-label">更多</span><span class="nav-meta">资料库·灵感</span></button>
        </nav>
      </div>
      <div class="sidebar-scroll" data-od-id="task-history">
        <div class="section-head"><span>任务 (67)</span><i data-lucide="chevron-down" class="icon"></i></div>
        <div id="taskList">
          <div class="task-row" data-task="你好"><span class="task-title">你好</span><i data-lucide="circle-alert" class="status-error"></i></div>
          <div class="task-row" data-task="询问当前模型"><span class="task-title">询问当前模型</span><span class="task-time">3天前</span></div>
          <div class="task-row" data-task="询问模型身份"><span class="task-title">询问模型身份</span><span class="task-time">3天前</span></div>
          <div class="task-row" data-task="整理项目截图"><span class="task-title">整理项目截图</span><span class="task-time">4天前</span></div>
          <div class="task-row" data-task="识别图片中的内容"><span class="task-title">识别图片中的内容</span><span class="task-time">4天前</span></div>
        </div>
        <button class="view-more" id="viewMore">查看更多 (62)</button>
        <div class="section-head"><span>空间 (1)</span><i data-lucide="chevron-down" class="icon"></i></div>
        <div class="space-row"><i data-lucide="git-branch" class="icon"></i><span class="task-title">项目新手指引</span><i data-lucide="chevron-down" class="icon"></i></div>
        <div class="task-row"><span class="task-title" style="padding-left:25px">生成项目功能介绍</span><span class="task-time">19天前</span></div>
      </div>
    </aside>
    <main class="main" data-od-id="main-workspace">
      <div class="mobile-topbar"><button class="icon-button" id="mobileMenuBtn" title="打开侧边栏"><i data-lucide="menu" class="icon"></i></button><span class="mobile-title">WorkBuddy</span></div>
      <section class="home-view" id="homeView" data-od-id="home-screen">
        <div class="home-page">
          <div class="home-header" data-od-id="home-heading">
            <h1 class="home-title">WorkBuddy</h1>
            <h2 class="home-subtitle" id="homeSubtitle">你的职场超能力</h2>
          </div>
          <div class="scene-tabs" role="tablist" aria-label="工作模式" data-od-id="scene-tabs">
            <button class="scene-tab active" data-scene="working" role="tab" aria-selected="true"><i data-lucide="coffee" class="icon"></i><span>日常办公</span></button>
            <button class="scene-tab" data-scene="coding" role="tab" aria-selected="false"><i data-lucide="code-xml" class="icon"></i><span>代码开发</span></button>
            <button class="scene-tab" data-scene="design" role="tab" aria-selected="false"><i data-lucide="palette" class="icon"></i><span>设计创意</span></button>
          </div>
          <div class="composer" data-od-id="home-composer">
            <div class="chips" id="chips" data-od-id="quick-actions"></div>
            <div class="input-shell">
              <img class="input-cat" src="assets/images/warning-cat.png" alt="WorkBuddy 助理角色">
              <div class="input-card">
                <textarea class="prompt" id="prompt" aria-label="任务输入" placeholder="今天帮你做些什么？ @ 引用对话文件，/ 调用技能与指令"></textarea>
                <div class="input-tools">
                  <div class="tools-left"><button class="round-tool" title="添加文件" id="attachBtn"><i data-lucide="plus" class="icon"></i></button></div>
                  <div class="tools-right">
                    <button class="text-tool" title="切换语言模式"><i data-lucide="languages" class="icon"></i><span>自动</span><i data-lucide="chevron-down" class="icon"></i></button>
                    <button class="send-button" id="sendBtn" title="发送任务" disabled><i data-lucide="arrow-up" class="icon"></i></button>
                  </div>
                </div>
              </div>
            </div>
            <div class="composer-footer"><span class="footer-option"><i data-lucide="folder" class="icon"></i>选择工作空间<i data-lucide="chevron-down" class="icon"></i></span><span class="footer-option"><i data-lucide="shield-check" class="icon"></i>默认权限<i data-lucide="chevron-down" class="icon"></i></span></div>
          </div>
        </div>
      </section>
      <aside class="activity-card" id="activityCard" data-od-id="activity-notice">
        <div class="activity-title"><i data-lucide="megaphone" class="icon"></i><span>活动通知</span></div>
        <p class="activity-copy">Hy3 正式发布，Agent 能力大升级！限免两周，体验更强工作流。</p>
        <div class="activity-actions"><button class="close-activity" id="closeActivity" title="关闭通知"><i data-lucide="x" class="icon"></i></button><button class="link-button" id="activityLink">立即了解</button></div>
      </aside>
      <section class="chat-view" id="chatView" hidden data-od-id="chat-screen">
        <header class="chat-header"><button class="icon-button" id="backHome" title="返回首页"><i data-lucide="arrow-left" class="icon"></i></button><span class="chat-header-title">新任务</span></header>
        <div class="messages" id="messages"></div>
        <div class="chat-composer"><div class="input-shell"><div class="input-card" style="min-height:112px"><textarea class="prompt" id="chatPrompt" placeholder="继续输入消息..."></textarea><div class="input-tools"><button class="round-tool" title="添加文件"><i data-lucide="plus" class="icon"></i></button><button class="send-button" id="chatSend"><i data-lucide="arrow-up" class="icon"></i></button></div></div></div></div>
      </section>
      <section class="module-view" id="moduleView" hidden data-od-id="module-screen"><div class="module-inner"><div class="module-toolbar"><div><h2 class="module-heading" id="moduleHeading"></h2><p class="module-subtitle" id="moduleSubtitle"></p></div><button class="primary-button" id="moduleAction"><i data-lucide="plus" class="icon"></i><span>新建</span></button></div><div class="module-grid" id="moduleGrid"></div></div></section>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="assets/vendor/lucide.min.js"></script>
  <script>
    const shell=document.getElementById('shell');
    const homeView=document.getElementById('homeView');
    const chatView=document.getElementById('chatView');
    const moduleView=document.getElementById('moduleView');
    const prompt=document.getElementById('prompt');
    const sendBtn=document.getElementById('sendBtn');
    const chips=document.getElementById('chips');
    const toast=document.getElementById('toast');
    const sceneData={
      working:{subtitle:'你的职场超能力',actions:[['文档处理','file-text'],['金融服务','briefcase-business'],['数据分析及可视化','chart-pie'],['更多','ellipsis']]},
      coding:{subtitle:'你的开发超能力',actions:[['生成代码','code-xml'],['分析仓库','git-pull-request'],['修复问题','wrench'],['编写测试','flask-conical']]},
      design:{subtitle:'你的设计超能力',actions:[['界面设计','panels-top-left'],['演示文稿','presentation'],['图片创作','image'],['品牌灵感','sparkles']]}
    };
    const moduleData={
      assistant:{title:'助理',subtitle:'与你的专属 AI 同事协作，持续处理复杂任务。',action:'创建助理',items:[['云助理','bot','在线，可开始新的协作任务'],['研究专家','search-check','擅长资料检索与结构化分析'],['内容编辑','notebook-pen','负责写作、校对与内容整理']]},
      projects:{title:'项目',subtitle:'集中管理工作空间、任务上下文与交付产物。',action:'新建项目',items:[['项目新手指引','git-branch','1 个任务 · 最近更新于 19 天前'],['品牌资料库','folder-kanban','文档、图片与共享上下文'],['工作周报','calendar-check','每周计划和汇报自动归档']]},
      capabilities:{title:'专家 · 技能 · 连接器',subtitle:'为 WorkBuddy 配置专业能力与外部服务。',action:'添加能力',items:[['文档处理','file-text','已安装 · 支持 Word、PDF 与 Markdown'],['腾讯文档','blocks','已连接 · 可读取和创建在线文档'],['数据分析','chart-no-axes-combined','已安装 · 支持表格与可视化']]},
      automation:{title:'自动化',subtitle:'让重复任务按计划运行，并在完成后通知你。',action:'添加自动化',items:[['每日工作简报','sunrise','工作日 09:00 运行'],['周报整理','calendar-range','每周五 17:30 运行'],['资料归档','archive','检测到新文件时运行']]},
      more:{title:'更多工具',subtitle:'访问资料库、灵感中心和常用工作入口。',action:'添加入口',items:[['资料库','library','统一保存常用信息与项目知识'],['灵感中心','lightbulb','浏览可直接复用的工作模板'],['腾讯文档','file-stack','快速打开最近访问的在线文档']]}
    };
    function refreshIcons(){if(window.lucide)lucide.createIcons({attrs:{'aria-hidden':'true'}})}
    function showToast(text){toast.textContent=text;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),1800)}
    function renderChips(scene){chips.innerHTML=sceneData[scene].actions.map(([label,icon])=>`<button class="chip" data-action="${label}"><i data-lucide="${icon}" class="icon"></i><span>${label}</span></button>`).join('');refreshIcons();chips.querySelectorAll('.chip').forEach(btn=>btn.addEventListener('click',()=>{chips.querySelectorAll('.chip').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');prompt.value=btn.dataset.action+'：';prompt.focus();sendBtn.disabled=false}))}
    function setView(name){
      document.querySelectorAll('.nav-button').forEach(btn=>btn.classList.toggle('active',btn.dataset.view===name));
      homeView.hidden=name!=='home';chatView.hidden=true;moduleView.hidden=name==='home';document.getElementById('activityCard').hidden=name!=='home';
      if(name!=='home')renderModule(name);if(innerWidth<=760)shell.classList.remove('mobile-sidebar-open');
    }
    function renderModule(name){const data=moduleData[name];document.getElementById('moduleHeading').textContent=data.title;document.getElementById('moduleSubtitle').textContent=data.subtitle;document.getElementById('moduleAction').querySelector('span').textContent=data.action;document.getElementById('moduleGrid').innerHTML=data.items.map((item,i)=>`<article class="module-card" data-od-id="${name}-card-${i+1}"><div class="module-card-head"><span class="module-card-icon"><i data-lucide="${item[1]}" class="icon"></i></span><span>${item[0]}</span></div><p>${item[2]}</p><div class="module-card-foot"><span><span class="status-dot"></span>${name==='automation'?'已启用':'可用'}</span>${name==='automation'?`<button class="switch on" aria-label="切换 ${item[0]}"></button>`:'<i data-lucide="chevron-right" class="icon"></i>'}</div></article>`).join('');refreshIcons();document.querySelectorAll('.switch').forEach(sw=>sw.addEventListener('click',e=>{e.stopPropagation();sw.classList.toggle('on');showToast(sw.classList.contains('on')?'自动化已启用':'自动化已暂停')}));document.querySelectorAll('.module-card').forEach(card=>card.addEventListener('click',()=>showToast('已打开 '+card.querySelector('.module-card-head span:last-child').textContent)))}
    function addMessage(text,role){const wrap=document.createElement('div');wrap.className='message '+role;wrap.innerHTML=role==='assistant'?`<img class="avatar" src="assets/images/assistant-avatar.png" alt="WorkBuddy 助理"><div class="message-bubble">${text}</div>`:`<div class="message-bubble">${text}</div>`;document.getElementById('messages').appendChild(wrap);document.getElementById('messages').scrollTop=99999}
    function sendTask(text){const value=text.trim();if(!value)return;homeView.hidden=true;moduleView.hidden=true;chatView.hidden=false;document.getElementById('activityCard').hidden=true;addMessage(value,'user');setTimeout(()=>addMessage('收到。我会先梳理目标和现有信息，再把任务拆成可执行步骤。你可以继续补充文件或约束。','assistant'),520);prompt.value='';sendBtn.disabled=true}
    document.getElementById('collapseBtn').addEventListener('click',()=>{if(innerWidth<=760)shell.classList.remove('mobile-sidebar-open');else shell.classList.toggle('sidebar-collapsed')});
    document.getElementById('mobileMenuBtn').addEventListener('click',()=>shell.classList.add('mobile-sidebar-open'));
    document.getElementById('searchBtn').addEventListener('click',()=>{const box=document.getElementById('searchBox');box.hidden=!box.hidden;if(!box.hidden)document.getElementById('taskSearch').focus()});
    document.getElementById('clearSearch').addEventListener('click',()=>{document.getElementById('taskSearch').value='';document.querySelectorAll('[data-task]').forEach(row=>row.hidden=false);document.getElementById('searchBox').hidden=true});
    document.getElementById('taskSearch').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll('[data-task]').forEach(row=>row.hidden=!row.dataset.task.toLowerCase().includes(q))});
    document.getElementById('filterBtn').addEventListener('click',e=>{e.currentTarget.classList.toggle('active');showToast(e.currentTarget.classList.contains('active')?'仅显示最近任务':'已显示全部任务')});
    document.querySelectorAll('.nav-button').forEach(btn=>btn.addEventListener('click',()=>setView(btn.dataset.view)));
    document.querySelectorAll('.scene-tab').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.scene-tab').forEach(x=>{x.classList.toggle('active',x===btn);x.setAttribute('aria-selected',x===btn)});document.getElementById('homeSubtitle').textContent=sceneData[btn.dataset.scene].subtitle;renderChips(btn.dataset.scene)}));
    prompt.addEventListener('input',()=>sendBtn.disabled=!prompt.value.trim());prompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendTask(prompt.value)}});sendBtn.addEventListener('click',()=>sendTask(prompt.value));
    document.getElementById('backHome').addEventListener('click',()=>{chatView.hidden=true;homeView.hidden=false;document.getElementById('activityCard').hidden=false});
    document.getElementById('chatSend').addEventListener('click',()=>{const p=document.getElementById('chatPrompt');if(p.value.trim()){addMessage(p.value,'user');p.value='';setTimeout(()=>addMessage('已记录，我会把这项要求纳入当前任务。','assistant'),360)}});
    document.getElementById('chatPrompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('chatSend').click()}});
    document.getElementById('closeActivity').addEventListener('click',()=>document.getElementById('activityCard').classList.add('closed'));
    document.getElementById('activityLink').addEventListener('click',()=>showToast('活动详情已打开'));
    document.getElementById('attachBtn').addEventListener('click',()=>showToast('选择要添加的文件'));
    document.getElementById('viewMore').addEventListener('click',e=>{e.currentTarget.textContent='已显示全部任务';showToast('任务列表已展开')});
    document.getElementById('moduleAction').addEventListener('click',()=>showToast(document.getElementById('moduleAction').innerText.trim()+'面板已打开'));
    document.querySelectorAll('.task-row').forEach(row=>row.addEventListener('click',()=>{const title=row.querySelector('.task-title')?.textContent;if(title){setView('home');sendTask(title)}}));
    renderChips('working');refreshIcons();
  </script>
</body>
</html>
