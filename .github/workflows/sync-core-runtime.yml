# Mirror official Hermes-CN-Core runtime release assets to the production
# Volcengine TOS runtime feed. The signed manifest JSON is uploaded as-is; do not
# rewrite artifactUrl here because it is part of the runtime signature payload.

name: sync-core-runtime

on:
  workflow_dispatch:
    inputs:
      runtime_tag:
        description: "Official Eynzof/Hermes-CN-Core runtime tag to sync, or latest"
        default: "latest"
        required: false
      channel:
        description: "Runtime manifest channel"
        default: "stable"
        required: false
      platforms:
        description: "Comma-separated platform-arch list"
        default: "win32-x64,darwin-arm64,darwin-x64,linux-x64"
        required: false
      verify_public_urls:
        description: "Verify public manifest URLs after upload"
        default: true
        type: boolean
        required: false
  schedule:
    # Keep the public mirror close to the official runtime feed without making
    # desktop release builds responsible for refreshing it.
    - cron: "17 20 * * *"

permissions:
  contents: read

concurrency:
  group: sync-core-runtime-${{ github.event.inputs.channel || 'stable' }}
  cancel-in-progress: false

env:
  CORE_RUNTIME_REPO: Eynzof/Hermes-CN-Core
  # Public TOS object prefix. The bucket is configured for the same HTTPS
  # PUT flow used by the Tapdance packaging pipeline.
  RUNTIME_FEED_BASE_URL: https://huanxing.tos-cn-beijing.volces.com/package/Hermes-CN-Core/runtime

jobs:
  sync:
    name: Sync official runtime assets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download and verify official runtime assets
        id: runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUNTIME_TAG: ${{ github.event.inputs.runtime_tag || 'latest' }}
          CHANNEL: ${{ github.event.inputs.channel || 'stable' }}
          PLATFORMS: ${{ github.event.inputs.platforms || 'win32-x64,darwin-arm64,darwin-x64,linux-x64' }}
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=commonjs - <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");

          const repo = process.env.CORE_RUNTIME_REPO || "Eynzof/Hermes-CN-Core";
          const requestedTag = (process.env.RUNTIME_TAG || "latest").trim() || "latest";
          const channel = (process.env.CHANNEL || "stable").trim() || "stable";
          const platforms = (process.env.PLATFORMS || "")
            .split(",")
            .map((item) => item.trim())
            .filter(Boolean);
          const token = process.env.GITHUB_TOKEN || "";

          if (platforms.length === 0) {
            throw new Error("No platforms requested.");
          }

          const headers = {
            "Accept": "application/vnd.github+json",
            "User-Agent": "hermes-agent-cn-desktop-runtime-sync",
          };
          if (token) headers.Authorization = `Bearer ${token}`;

          async function fetchOk(url, options = {}) {
            const response = await fetch(url, {
              ...options,
              headers: {
                ...headers,
                ...(options.headers || {}),
              },
            });
            if (!response.ok) {
              throw new Error(`${url} -> HTTP ${response.status}`);
            }
            return response;
          }

          async function fetchJson(url) {
            return await (await fetchOk(url)).json();
          }

          async function sleep(ms) {
            await new Promise((resolve) => setTimeout(resolve, ms));
          }

          async function downloadBytes(url, attempts = 4) {
            let lastError;
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              try {
                const response = await fetchOk(url, {
                  headers: {
                    "Accept": "application/octet-stream",
                  },
                });
                return Buffer.from(await response.arrayBuffer());
              } catch (error) {
                lastError = error;
                if (attempt < attempts) {
                  console.warn(`download failed for ${url} (attempt ${attempt}/${attempts}): ${error?.message || error}`);
                  await sleep(1000 * attempt);
                }
              }
            }
            throw lastError;
          }

          function sha256(buffer) {
            return crypto.createHash("sha256").update(buffer).digest("hex");
          }

          function splitPlatformArch(value) {
            const index = value.lastIndexOf("-");
            if (index <= 0 || index === value.length - 1) {
              throw new Error(`Invalid platform-arch entry: ${value}`);
            }
            return {
              platform: value.slice(0, index),
              arch: value.slice(index + 1),
            };
          }

          async function main() {
            const release = requestedTag === "latest"
              ? await fetchJson(`https://api.github.com/repos/${repo}/releases/latest`)
              : await fetchJson(`https://api.github.com/repos/${repo}/releases/tags/${encodeURIComponent(requestedTag)}`);

            const releaseTag = release.tag_name;
            if (!releaseTag) {
              throw new Error("GitHub release response is missing tag_name.");
            }

            const assets = new Map((release.assets || []).map((asset) => [asset.name, asset]));
            const outRoot = "runtime-sync";
            fs.rmSync(outRoot, { recursive: true, force: true });
            fs.mkdirSync(path.join(outRoot, channel), { recursive: true });

            const records = [];
            const runtimeVersions = new Set();

            for (const platformArch of platforms) {
              const { platform, arch } = splitPlatformArch(platformArch);
              const manifestName = `${channel}-${platform}-${arch}.json`;
              const zipName = `hermes-agent-cn-runtime-${platform}-${arch}.zip`;
              const manifestAsset = assets.get(manifestName);
              const zipAsset = assets.get(zipName);
              if (!manifestAsset) {
                throw new Error(`Release ${releaseTag} is missing asset: ${manifestName}`);
              }
              if (!zipAsset) {
                throw new Error(`Release ${releaseTag} is missing asset: ${zipName}`);
              }

              const manifestBytes = await downloadBytes(manifestAsset.browser_download_url);
              const manifest = JSON.parse(manifestBytes.toString("utf8"));
              if (manifest.schemaVersion !== 2) {
                throw new Error(`${manifestName}: expected schemaVersion 2, got ${manifest.schemaVersion}`);
              }
              if (manifest.channel !== channel || manifest.platform !== platform || manifest.arch !== arch) {
                throw new Error(`${manifestName}: manifest identity mismatch`);
              }
              if (!manifest.runtimeVersion) {
                throw new Error(`${manifestName}: missing runtimeVersion`);
              }
              if (!manifest.sha256) {
                throw new Error(`${manifestName}: missing sha256`);
              }
              if (!manifest.signature) {
                throw new Error(`${manifestName}: missing signature`);
              }

              const zipBytes = await downloadBytes(zipAsset.browser_download_url);
              const actualSha = sha256(zipBytes);
              const expectedSha = String(manifest.sha256).toLowerCase();
              if (actualSha !== expectedSha) {
                throw new Error(`${zipName}: sha256 mismatch, expected ${expectedSha}, got ${actualSha}`);
              }

              const releaseVersionDir = path.join(outRoot, "releases", manifest.runtimeVersion);
              fs.mkdirSync(releaseVersionDir, { recursive: true });
              fs.writeFileSync(path.join(outRoot, channel, manifestName), manifestBytes);
              fs.writeFileSync(path.join(outRoot, channel, zipName), zipBytes);
              fs.writeFileSync(path.join(releaseVersionDir, manifestName), manifestBytes);
              fs.writeFileSync(path.join(releaseVersionDir, zipName), zipBytes);

              runtimeVersions.add(manifest.runtimeVersion);
              records.push({
                platform,
                arch,
                manifestName,
                zipName,
                runtimeVersion: manifest.runtimeVersion,
                sha256: actualSha,
                sourceRepo: manifest.sourceRepo,
                sourceCommit: manifest.sourceCommit,
                artifactUrl: manifest.artifactUrl,
                zipSize: zipBytes.length,
              });
            }

            fs.writeFileSync(path.join(outRoot, "summary.json"), JSON.stringify({
              repo,
              requestedTag,
              releaseTag,
              channel,
              runtimeVersions: Array.from(runtimeVersions).sort(),
              records,
            }, null, 2) + "\n");

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_tag=${releaseTag}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `channel=${channel}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `runtime_versions=${Array.from(runtimeVersions).sort().join(",")}\n`);
            console.log(`Prepared ${records.length} runtime platform asset set(s) from ${repo}@${releaseTag}.`);
            for (const record of records) {
              console.log(`${record.manifestName}: ${record.runtimeVersion} ${record.sha256}`);
              if (!String(record.artifactUrl || "").startsWith(process.env.RUNTIME_FEED_BASE_URL || "")) {
                console.log(`notice: ${record.manifestName} keeps signed artifactUrl: ${record.artifactUrl}`);
              }
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload prepared runtime sync artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-sync-${{ steps.runtime.outputs.release_tag }}
          path: runtime-sync/

      - name: Upload runtime assets to Volcengine TOS
        env:
          CHANNEL: ${{ steps.runtime.outputs.channel }}
        run: node scripts/upload-tos.mjs

      - name: Verify public runtime manifests
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.verify_public_urls != 'false' }}
        env:
          CHANNEL: ${{ steps.runtime.outputs.channel }}
        shell: bash
        run: |
          set -euo pipefail

          for manifest in runtime-sync/"$CHANNEL"/*.json; do
            name="$(basename "$manifest")"
            expected_sha="$(sha256sum "$manifest" | awk '{print $1}')"
            url="$RUNTIME_FEED_BASE_URL/$CHANNEL/$name"
            echo "Verifying $url"
            tmp="$(mktemp)"
            for attempt in 1 2 3 4 5; do
              if curl -fsSL -H "Cache-Control: no-cache" "$url" -o "$tmp"; then
                actual_sha="$(sha256sum "$tmp" | awk '{print $1}')"
                if [[ "$actual_sha" == "$expected_sha" ]]; then
                  rm -f "$tmp"
                  continue 2
                fi
                echo "Downloaded manifest sha256 mismatch on attempt $attempt: $actual_sha != $expected_sha"
              else
                echo "Manifest download failed on attempt $attempt"
              fi
              sleep $((attempt * 10))
            done
            rm -f "$tmp"
            echo "Public manifest did not match uploaded content: $url" >&2
            exit 1
          done
