name: web-e2e

# Temporary acceptance branch only. No product build, fake model or publication.
on:
  workflow_dispatch:
    inputs:
      desktop_sha:
        description: Exact final Desktop source commit
        required: true
        type: string
      candidate_run_id:
        description: Successful release-desktop CI run that produced this candidate
        required: true
        type: string
      candidate_sha256:
        description: Previously verified SHA256 of the original checksums.txt
        required: true
        type: string
      release_tag:
        description: Existing candidate release tag (draft or public)
        required: true
        default: v0.9.0
        type: string
      visual_notice_confirmed:
        description: Release owner has notified the user before this visual acceptance
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  final-linux-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      DESKTOP_SHA: ${{ inputs.desktop_sha }}
      CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      VISUAL_NOTICE_CONFIRMED: ${{ inputs.visual_notice_confirmed }}
    steps:
      - name: Validate explicit final inputs and visual notice
        shell: bash
        run: |
          set -euo pipefail
          test "$VISUAL_NOTICE_CONFIRMED" = true
          [[ "$DESKTOP_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]
          test "$RELEASE_TAG" = v0.9.0
      - name: Checkout this isolated acceptance harness
        uses: actions/checkout@v4
        with:
          path: acceptance
          persist-credentials: false
      - name: Read the final source public keys without building the product
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.desktop_sha }}
          path: release-source
          persist-credentials: false
      - name: Install Ubuntu desktop test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign xvfb xauth dbus-x11 imagemagick xdotool libfuse2
      - name: Fetch original candidate and verify both Linux updater signatures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 acceptance/scripts/release-acceptance/linux-candidate.py --source release-source --assets linux-assets --output evidence/candidate.json
      - name: Install the actual final Debian package
        shell: bash
        run: |
          set -euo pipefail
          deb="$(python3 -c 'import json; print(json.load(open("evidence/candidate.json"))["formats"]["deb"]["path"])')"
          sudo apt-get install -y "$deb"
      - name: Start both real installed desktops under an isolated X11 session
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a --server-args='-screen 0 1440x1000x24' dbus-run-session -- python3 acceptance/scripts/release-acceptance/linux-desktop-smoke.py --candidate evidence/candidate.json --output evidence
      - name: Retain native screenshots, actual process paths and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu2204-final-desktop-smoke
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
