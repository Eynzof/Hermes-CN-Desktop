# Rust backend test suite for hermes-agent-cn-desktop.
#
# Runs on every PR and push to main. Separate workflow from
# release-desktop.yml so a flaky test does not block tagged releases.
#
# Linux-only matrix: the test suite is platform-independent except for
# prevent_sleep.rs (macOS only, gated behind cfg). Running on ubuntu
# is faster + cheaper than the cross-platform matrix.
#
# Embedded runtime (refactor_report.md):
# - The default job runs `cargo test` WITHOUT --all-features: the optional
#   `embedded-python` feature links libpython, which ubuntu runners do not
#   provide out of the box. The embedded architecture (FFI registry, event
#   bus, transport, payload resolution) is still fully tested by tests/embedded.rs.
# - The embedded job installs python3-dev, enables the feature, and runs
#   the real-interpreter tests (tests/embedded_python.rs) against the
#   `hermes_embedded` reference package staged by the repo.
# - The no-http deny step enforces success criteria 8: src/embedded/ must
#   contain no asgi/uvicorn/reqwest/tungstenite symbols (Hard FFI end-state).
# - The FFI coverage step enforces success criteria 9: every proxy-pass route
#   registered in the REST FFI surface must have a direct FFI entry.

name: rust-test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        # Required by tauri-build (build.rs) — even cargo test compiles the
        # crate, which links against webkit/gtk via tauri's deps.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        # NOTE: no --all-features — the optional `embedded-python` feature
        # links libpython and is exercised by the dedicated embedded job below.
        run: cargo test --no-fail-fast

      - name: Embedded FFI coverage gate (success criteria 9)
        # tests/embedded.rs + the ffi.rs unit test assert every proxy-pass
        # route has a direct FFI entry (1:1 with the report mapping table);
        # this step is the CI-level grep so the gate cannot be skipped by an
        # empty test binary.
        run: cargo test --lib embedded::ffi::tests::proxy_pass_route_list_is_fully_covered

      - name: Embedded no-http deny (success criteria 8)
        # Hard FFI end-state: no in-process ASGI/uvicorn/HTTP/WS transport
        # symbols may exist in the embedded architecture.
        run: |
          if grep -rniE "asgi|uvicorn|reqwest|tungstenite" src/embedded/; then
            echo "::error::src/embedded/ must be zero-HTTP (no asgi/uvicorn/reqwest/tungstenite)"
            exit 1
          fi

  embedded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps + Python dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            python3-dev \
            python3

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Python embedded selftest
        run: python3 -m hermes_embedded.selftest

      - name: cargo check (embedded-python feature)
        env:
          PYO3_PYTHON: python3
        run: cargo check --features embedded-python

      - name: cargo test (embedded-python feature)
        env:
          PYO3_PYTHON: python3
        run: cargo test --features embedded-python --test embedded_python --no-fail-fast
