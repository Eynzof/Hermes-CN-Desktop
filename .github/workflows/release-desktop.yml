# Three explicit stages: build a private draft, publish exact accepted bytes
# with latest=false, then promote GitHub latest. D1 rollout uses hot-update:control.

name: release-desktop

on:
  workflow_dispatch:
    inputs:
      action:
        description: "build 只生成草稿；publish 公开但不设 latest；promote 设为 latest"
        type: choice
        options: [build, publish, promote]
        default: build
        required: true
      tag:
        description: "目标版本 tag；build 可尚不存在（例如 v0.9.0）"
        required: true
      bundled_runtime_tag:
        description: "要内置的 Hermes-CN-Core runtime 固定 tag；禁止 latest"
        default: "runtime-v0.21.0-cn.15"
        required: true
      bundled_runtime_channel:
        description: "固定 runtime tag 中的 manifest 渠道"
        type: choice
        options: [stable, canary, beta, prototype]
        default: stable
        required: true
      channel:
        description: "更新渠道；D1 注册与投放通过 hot-update:control 单独执行"
        type: choice
        options: [prototype, canary, beta, stable]
        default: stable
        required: true

      release_environment:
        description: "正式环境或测试环境；stable 必须 production"
        type: choice
        options: [production, staging]
        default: production
        required: true
      windows_signing:
        description: "Windows 系统签名；所有模式均保留 Tauri 更新签名"
        type: choice
        options: [none, authenticode]
        default: none
        required: true
      candidate_sha256:
        description: "publish / promote 必填：已验收草稿 checksums.txt 的 SHA256"
        required: false

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    if: inputs.action == 'build'
    runs-on: ubuntu-latest
    environment: hot-update-${{ inputs.release_environment }}
    outputs:
      source_sha: ${{ steps.meta.outputs.source_sha }}
      tag: ${{ steps.meta.outputs.tag }}
      channel: ${{ steps.meta.outputs.channel }}
      runtime_tag: ${{ steps.meta.outputs.runtime_tag }}
      runtime_channel: ${{ steps.meta.outputs.runtime_channel }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
      - uses: pnpm/action-setup@v3
        with:
          version: "9"
      - run: pnpm install --frozen-lockfile
      - name: Resolve immutable release inputs
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          INPUT_RUNTIME_TAG: ${{ github.event.inputs.bundled_runtime_tag || 'runtime-v0.21.0-cn.15' }}
          INPUT_RUNTIME_CHANNEL: ${{ inputs.bundled_runtime_channel }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          RELEASE_ENVIRONMENT: ${{ inputs.release_environment }}
          WINDOWS_SIGNING: ${{ inputs.windows_signing }}
          HOT_UPDATE_CONTROL_ENDPOINT: ${{ vars.HOT_UPDATE_CONTROL_ENDPOINT }}
          HOT_UPDATE_MIRROR_ORIGIN: ${{ vars.HOT_UPDATE_MIRROR_ORIGIN }}
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          runtime_tag="$INPUT_RUNTIME_TAG"
          channel="$INPUT_CHANNEL"
          if [ -z "$channel" ]; then
            case "$tag" in
              *-beta*) channel=beta ;;
              *-rc*|*-canary*) channel=canary ;;
              *-nightly*|*-prototype*) channel=prototype ;;
              *) channel=stable ;;
            esac
          fi
          if [ "$runtime_tag" = latest ] || [[ "$runtime_tag" == */latest ]]; then
            echo "bundled_runtime_tag 禁止使用 latest" >&2
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          test "$tag" = "v$version"
          source_sha="$(git rev-parse HEAD)"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$source_sha" = "$(git rev-parse "$tag^{commit}")"
          fi
          node scripts/desktop-release-policy.mjs validate
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          test "$(node -p "require('./tauri.conf.json').identifier")" = "cn.org.hermesagent.desktop"
          node scripts/check-desktop-core-compatibility.mjs --runtime-schema 2
          {
            echo "tag=$tag"
            echo "channel=$channel"
            echo "runtime_tag=$runtime_tag"
            echo "runtime_channel=$INPUT_RUNTIME_CHANNEL"
            if [ "$channel" = stable ]; then echo "prerelease=false"; else echo "prerelease=true"; fi
          } >> "$GITHUB_OUTPUT"
      - name: Validate version, compatibility matrix and generated files
        run: |
          pnpm typecheck
          pnpm hot-update:control:test
          node --test scripts/desktop-release-policy.test.mjs
          pnpm --dir infra/hot-update-staging test
          pnpm --dir infra/release-mirror test

  build:
    needs: preflight
    environment: hot-update-${{ inputs.release_environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            runtime_platform: win32
            runtime_arch: x64
            bundles: nsis
          - runner: macos-14
            target: aarch64-apple-darwin
            runtime_platform: darwin
            runtime_arch: arm64
            bundles: app,dmg
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            runtime_platform: darwin
            runtime_arch: x64
            bundles: app,dmg
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            runtime_platform: linux
            runtime_arch: x64
            bundles: deb,appimage
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
      - uses: pnpm/action-setup@v3
        with:
          version: "9"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: matrix.runtime_platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential curl file \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev patchelf wget
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: pnpm install --frozen-lockfile

      - name: Resolve pinned runtime manifest
        id: runtime_manifest
        shell: bash
        env:
          RUNTIME_TAG: ${{ needs.preflight.outputs.runtime_tag }}
          RUNTIME_CHANNEL: ${{ needs.preflight.outputs.runtime_channel }}
          RUNTIME_PLATFORM: ${{ matrix.runtime_platform }}
          RUNTIME_ARCH: ${{ matrix.runtime_arch }}
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          (async () => {
            const tag = process.env.RUNTIME_TAG;
            if (!tag || tag === "latest") throw new Error("runtime tag must be immutable");
            const url = `https://github.com/Eynzof/Hermes-CN-Core/releases/download/${encodeURIComponent(tag)}/${process.env.RUNTIME_CHANNEL}-${process.env.RUNTIME_PLATFORM}-${process.env.RUNTIME_ARCH}.json`;
            const response = await fetch(url, { headers: { "User-Agent": "hermes-desktop-release" } });
            if (!response.ok) throw new Error(`runtime manifest HTTP ${response.status}`);
            const manifest = await response.json();
            for (const field of ["sourceRepo", "sourceCommit", "runtimeVersion", "kernelVersion", "runtimeRevision"]) {
              if (manifest[field] === undefined || manifest[field] === "") throw new Error(`runtime manifest missing ${field}`);
            }
            if (manifest.schemaVersion !== 2) throw new Error(`runtime schema ${manifest.schemaVersion} is not 2`);
            for (const [key, value] of Object.entries({
              source_repo: manifest.sourceRepo,
              source_commit: manifest.sourceCommit,
              runtime_version: manifest.runtimeVersion,
              kernel_version: manifest.kernelVersion,
              runtime_revision: manifest.runtimeRevision,
            })) fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.runtime_manifest.outputs.source_repo }}
          ref: ${{ steps.runtime_manifest.outputs.source_commit }}
          path: hermes-agent-cn-source
          persist-credentials: false
      - name: Stage pinned bundled content
        shell: bash
        run: |
          node scripts/stage-dashboard-web-dist.mjs --source hermes-agent-cn-source
          node scripts/stage-bundled-skills.mjs --source hermes-agent-cn-source
          node scripts/stage-bundled-plugins.mjs --source hermes-agent-cn-source
          node scripts/stage-bundled-runtime.mjs \
            --repo Eynzof/Hermes-CN-Core \
            --tag "${{ needs.preflight.outputs.runtime_tag }}" \
            --channel "${{ needs.preflight.outputs.runtime_channel }}" \
            --platform "${{ matrix.runtime_platform }}" \
            --arch "${{ matrix.runtime_arch }}"
      - name: Verify bundled runtime extraction and anti-downgrade contract
        shell: bash
        env:
          HERMES_RELEASE_RUNTIME_ZIP: ${{ github.workspace }}/static/bundled-runtime/hermes-agent-cn-runtime-${{ matrix.runtime_platform }}-${{ matrix.runtime_arch }}.zip
        run: cargo test --locked --all-features --lib release_runtime_zip_extracts_with_installer -- --ignored --nocapture

      - name: Prepare Windows Authenticode identity
        if: matrix.runtime_platform == 'win32'
        shell: pwsh
        env:
          WINDOWS_SIGNING: ${{ inputs.windows_signing }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        run: |
          if ($env:WINDOWS_SIGNING -eq "none") {
            @{ bundle = @{ windows = @{ certificateThumbprint = $null; signCommand = $null } } } |
              ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 windows-signing-config.json
            exit 0
          }
          if ($env:WINDOWS_SIGNING -ne "authenticode" -or -not $env:WINDOWS_CERTIFICATE) {
            throw "authenticode 模式必须配置 Windows 签名证书"
          }
          $pfx = Join-Path $env:RUNNER_TEMP "hermes-windows-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $cert.Thumbprint) { throw "无法导入 Windows 签名证书" }
          @{
            bundle = @{ windows = @{
              certificateThumbprint = $cert.Thumbprint
              digestAlgorithm = "sha256"
              timestampUrl = $env:WINDOWS_TIMESTAMP_URL
            }}
          } | ConvertTo-Json -Depth 5 -Compress | Set-Content -Encoding utf8 windows-signing-config.json

      - name: Prepare macOS signing and notarization identity
        if: matrix.runtime_platform == 'darwin'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE" && test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_SIGNING_IDENTITY" && test -n "$APPLE_API_KEY" && test -n "$APPLE_API_PRIVATE_KEY"
          mkdir -p "$RUNNER_TEMP/appstoreconnect/private_keys"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          chmod 600 "$RUNNER_TEMP/appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          keychain_password="$(uuidgen)"
          keychain="$RUNNER_TEMP/hermes-signing.keychain-db"
          certificate="$RUNNER_TEMP/hermes-apple-certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          existing_keychains=()
          while IFS= read -r existing_keychain; do
            existing_keychains+=("$existing_keychain")
          done < <(security list-keychains -d user | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//')
          security list-keychains -d user -s "$keychain" "${existing_keychains[@]}"
          security find-identity -v -p codesigning "$keychain"
      - name: Verify bundled macOS Runtime signatures
        if: matrix.runtime_platform == 'darwin'
        shell: bash
        run: scripts/verify-macos-runtime-payload.sh "static/bundled-runtime/hermes-agent-cn-runtime-${{ matrix.runtime_platform }}-${{ matrix.runtime_arch }}.zip"

      - name: Build signed Tauri bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          HERMES_BAKED_UPDATE_CHANNEL: ${{ needs.preflight.outputs.channel }}
          HERMES_BAKED_SHELL_UPDATE_ENDPOINT: ${{ vars.HOT_UPDATE_CONTROL_ENDPOINT }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          args=(--target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}")
          if [ -f windows-signing-config.json ]; then
            args+=(--config windows-signing-config.json)
          fi
          pnpm exec tauri build "${args[@]}"

      - name: Verify Windows Authenticode
        if: matrix.runtime_platform == 'win32'
        shell: pwsh
        env:
          WINDOWS_SIGNING: ${{ inputs.windows_signing }}
        run: |
          $installers = Get-ChildItem "target/${{ matrix.target }}/release/bundle/nsis/*.exe"
          if (-not $installers) { throw "缺少 NSIS installer" }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            $expected = if ($env:WINDOWS_SIGNING -eq "authenticode") { "Valid" } else { "NotSigned" }
            if ($signature.Status.ToString() -ne $expected) {
              throw "$($installer.Name) Authenticode: $($signature.Status), expected $expected"
            }
            Write-Host "$($installer.Name): Authenticode=$($signature.Status); Tauri signature required"
          }
      - name: Package Windows portable build
        if: matrix.runtime_platform == 'win32'
        run: node scripts/package-portable-windows.mjs --target ${{ matrix.target }}

      - name: Notarize/staple macOS and regenerate final updater package
        if: matrix.runtime_platform == 'darwin'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/appstoreconnect/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          updaters=(target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz)
          test ${#dmgs[@]} -eq 1 && test ${#updaters[@]} -eq 1
          dmg="${dmgs[0]}"
          updater="${updaters[0]}"
          submit="$RUNNER_TEMP/notary-submit.json"
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" --wait --output-format json | tee "$submit"
          test "$(node -p "JSON.parse(require('fs').readFileSync('$submit','utf8')).status")" = Accepted
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -vvv -t open --context context:primary-signature "$dmg"
          app="target/${{ matrix.target }}/release/bundle/macos/Hermes Agent CN Desktop.app"
          mount="$(mktemp -d)"
          hdiutil attach "$dmg" -mountpoint "$mount" -nobrowse -quiet
          rm -rf "$app"
          ditto "$mount/Hermes Agent CN Desktop.app" "$app"
          hdiutil detach "$mount" -quiet
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl -a -vvv --type exec "$app"
          rm -f "$updater" "$updater.sig"
          tar -czf "$updater" -C "$(dirname "$app")" "$(basename "$app")"
          pnpm exec tauri signer sign "$updater"
          node scripts/package-portable-macos.mjs --target ${{ matrix.target }}

      - name: Smoke test the Core inside the final macOS app
        if: matrix.runtime_platform == 'darwin'
        shell: bash
        run: |
          python3 scripts/release-runtime-smoke.py \
            --app-root "target/${{ matrix.target }}/release/bundle/macos/Hermes Agent CN Desktop.app" \
            --platform darwin --arch "${{ matrix.runtime_arch }}" \
            --output "release-smoke/${{ matrix.runtime_platform }}-${{ matrix.runtime_arch }}.json"
      - name: Smoke test the Core inside the final Linux AppImage
        if: matrix.runtime_platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=("$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/bundle/appimage/"*.AppImage)
          test ${#appimages[@]} -eq 1
          mkdir -p "$RUNNER_TEMP/desktop-appimage"
          cd "$RUNNER_TEMP/desktop-appimage"
          "${appimages[0]}" --appimage-extract > appimage-extract.log
          python3 "$GITHUB_WORKSPACE/scripts/release-runtime-smoke.py" \
            --app-root "$RUNNER_TEMP/desktop-appimage/squashfs-root" \
            --platform linux --arch "${{ matrix.runtime_arch }}" \
            --output "$GITHUB_WORKSPACE/release-smoke/${{ matrix.runtime_platform }}-${{ matrix.runtime_arch }}.json"
      - uses: actions/upload-artifact@v4
        if: always() && matrix.runtime_platform != 'win32'
        with:
          name: runtime-smoke-${{ matrix.runtime_platform }}-${{ matrix.runtime_arch }}
          path: release-smoke/*
          if-no-files-found: warn
          retention-days: 30

      - name: Collect final platform assets and release provenance
        shell: bash
        run: |
          node scripts/collect-release-artifacts.mjs \
            --platform "${{ matrix.runtime_platform }}" \
            --arch "${{ matrix.runtime_arch }}" \
            --target "${{ matrix.target }}" \
            --runtime-tag "${{ needs.preflight.outputs.runtime_tag }}" \
            --desktop-sha "$(git rev-parse HEAD)" \
            --output release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.runtime_platform }}-${{ matrix.runtime_arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  prepare-draft:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    environment: hot-update-${{ inputs.release_environment }}
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
      RELEASE_SHA: ${{ needs.preflight.outputs.source_sha }}
      PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
      RELEASE_ENVIRONMENT: ${{ inputs.release_environment }}
      INPUT_CHANNEL: ${{ inputs.channel }}
      WINDOWS_SIGNING: ${{ inputs.windows_signing }}
      HOT_UPDATE_CONTROL_ENDPOINT: ${{ vars.HOT_UPDATE_CONTROL_ENDPOINT }}
      HOT_UPDATE_MIRROR_ORIGIN: ${{ vars.HOT_UPDATE_MIRROR_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Build release record and verify final updater signatures
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          node scripts/finalize-release-record.mjs release-assets
          node scripts/desktop-release-policy.mjs finalize release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release-candidate
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
      - name: Create private draft from the pinned source SHA
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            # Never overwrite an accepted candidate. Delete an obsolete draft explicitly before rebuilding.
            echo "Release already exists; refusing to replace its accepted bytes" >&2
            exit 1
          fi
          args=(release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --draft --latest=false \
            --title "Hermes Agent 中文社区桌面版 $RELEASE_TAG" \
            --notes "固定 Desktop/Core/Runtime 输入构建。Windows 系统签名模式：$WINDOWS_SIGNING；所有更新包采用 Tauri 签名。")
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh "${args[@]}"
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f -print0)
          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY"
      - name: Re-download every draft asset and verify exact bytes
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir verify-github
          CANDIDATE_SHA256="$(sha256sum release-assets/checksums.txt | cut -d ' ' -f 1)"
          export CANDIDATE_SHA256
          node scripts/desktop-release-policy.mjs verify verify-github
          {
            echo "### Candidate fingerprint"
            echo "candidate_sha256=$CANDIDATE_SHA256"
            echo "Draft only. Next: publish after final-package acceptance; no latest or rollout changed."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    if: inputs.action == 'publish' || inputs.action == 'promote'
    runs-on: ubuntu-latest
    environment: hot-update-${{ inputs.release_environment }}
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_ACTION: ${{ inputs.action }}
      RELEASE_ENVIRONMENT: ${{ inputs.release_environment }}
      INPUT_CHANNEL: ${{ inputs.channel }}
      WINDOWS_SIGNING: ${{ inputs.windows_signing }}
      CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
      HOT_UPDATE_CONTROL_ENDPOINT: ${{ vars.HOT_UPDATE_CONTROL_ENDPOINT }}
      HOT_UPDATE_MIRROR_ORIGIN: ${{ vars.HOT_UPDATE_MIRROR_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
      - name: Verify the exact accepted candidate and immutable source
        run: |
          set -euo pipefail
          node scripts/desktop-release-policy.mjs validate
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets
          node scripts/desktop-release-policy.mjs verify release-assets
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,targetCommitish > "$RUNNER_TEMP/release.json"
          node scripts/desktop-release-policy.mjs verify-stage release-assets "$RUNNER_TEMP/release.json"
          source_sha="$(node -p "require('./release-assets/release-record.json').desktopSha")"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$source_sha"
          fi
      - name: Publish accepted assets without making latest
        if: inputs.action == 'publish'
        run: |
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
      - name: Verify public origin and mirror before registration or promotion
        run: node scripts/desktop-release-policy.mjs verify-downloads release-assets
      - name: Record the separate rollout step
        if: inputs.action == 'publish'
        run: |
          {
            echo "Public assets verified; GitHub latest is unchanged."
            echo "Next: register-draft and controlled rollout using scripts/hot-update-control.mjs against the selected D1 database."
            echo "After final acceptance, dispatch action=promote with the same candidate_sha256."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Promote the verified stable release to GitHub latest
        if: inputs.action == 'promote'
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --latest=true
